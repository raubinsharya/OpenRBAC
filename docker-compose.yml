services:
  postgres:
    image: postgres:15-alpine
    container_name: rbac_postgres
    environment:
      POSTGRES_DB: open_rbac
      POSTGRES_USER: rbac_user
      POSTGRES_PASSWORD: rbac123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - rbac_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rbac_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rbac_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rbac_redis_ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8000:8081"
    networks:
      - rbac_network
    depends_on:
      - redis
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rbac_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rbac.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8001:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rbac_network
    depends_on:
      - postgres
      - keycloak-db
    restart: unless-stopped

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - rbac_network
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rbac_network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://host.docker.internal:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - rbac_network
    restart: unless-stopped

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 4000
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      # Kafka SPI Configuration
      KC_SPI_EVENTS_LISTENER_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KC_SPI_EVENTS_LISTENER_KAFKA_TOPIC_EVENTS: keycloak-events
      KC_SPI_EVENTS_LISTENER_KAFKA_TOPIC_ADMIN_EVENTS: keycloak-admin-events
      KC_SPI_EVENTS_LISTENER_KAFKA_CLIENT_ID: keycloak
    ports:
      - "4000:8080"
    networks:
      - rbac_network
    depends_on:
      - keycloak-db
      - kafka
    restart: unless-stopped
    command: start-dev

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "9000:8080"
    networks:
      - rbac_network
    depends_on:
      - kafka
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  keycloak_db_data:
  kafka_data:
  zookeeper_data:
  pgadmin_data:


networks:
  rbac_network:
    driver: bridge
